services:
  - type: web
    name: trustvault-app
    runtime: docker
    branch: master
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./trustvault.db
      - key: STORAGE_DIR
        value: /app/storage/private
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: '["*"]'
